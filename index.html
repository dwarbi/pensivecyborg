<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~* Under Construction *~</title>
    <style>
        body {
            background-color: #000080;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            color: #00FF00;
            font-family: 'Comic Sans MS', 'Courier New', cursive;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #000000;
            border: 3px ridge #C0C0C0;
            padding: 20px;
        }
        
        h1 {
            color: #FFFF00;
            font-size: 2.5em;
            text-shadow: 2px 2px #FF0000;
            margin-bottom: 0;
        }
        
        .marquee-text {
            color: #FF00FF;
            font-size: 1.2em;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .construction-gif {
            margin: 20px 0;
        }
        
        .construction-gif img {
            max-width: 400px;
            border: 2px solid #FFFF00;
        }
        
        hr {
            border: none;
            height: 3px;
            background: linear-gradient(to right, #FF0000, #FFFF00, #00FF00, #00FFFF, #0000FF, #FF00FF);
            margin: 20px 0;
        }
        
        .counter {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            padding: 5px 10px;
            border: 2px inset #808080;
            display: inline-block;
            margin: 10px 0;
        }
        
        .guestbook {
            color: #00FFFF;
            font-size: 1.1em;
            margin: 15px 0;
        }
        
        .guestbook a {
            color: #FF00FF;
            text-decoration: underline;
        }
        
        .email-link {
            color: #FFFF00;
        }
        
        .badges {
            margin-top: 20px;
        }
        
        .badges img {
            margin: 5px;
            border: 1px solid #808080;
        }
        
        .best-viewed {
            font-size: 0.9em;
            color: #C0C0C0;
            margin-top: 20px;
        }
        
        .fire-text {
            color: #FF6600;
            animation: flicker 0.5s infinite alternate;
        }
        
        @keyframes flicker {
            from { text-shadow: 0 0 5px #FF0000, 0 0 10px #FF6600; }
            to { text-shadow: 0 0 10px #FF0000, 0 0 20px #FF6600; }
        }
        
        .spinning {
            animation: spin 3s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .stars {
            color: #FFFF00;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="stars">★ ☆ ★ ☆ ★ ☆ ★ ☆ ★</p>
        
        <h1>~* UNDER CONSTRUCTION *~</h1>
        
        <p class="marquee-text">! ! ! COME BACK SOON ! ! !</p>
        
        <hr>
        
        <div class="construction-gif">
            <img src="under-construction90s.gif" alt="Under Construction" onerror="this.src='https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif'">
        </div>
        
        <p style="color: #00FFFF; font-size: 1.3em;">
            This site is currently being built!<br>
            <span class="fire-text">Something AWESOME is coming!</span>
        </p>
        
        <hr>
        
        <div class="counter">
            You are visitor #: <span style="color: #FF0000;">000,042</span>
        </div>
        
        <p class="guestbook">
            📝 <a href="#">Sign my Guestbook!</a> 📝
        </p>
        
        <hr>
        
        <div class="badges">
            <img src="https://web.archive.org/web/20091026212929im_/http://geocities.com/Hollywood/Hills/5498/netscape.gif" alt="Netscape Now!" width="88" height="31" onerror="this.style.display='none'">
            <img src="https://web.archive.org/web/20091026192242im_/http://www.geocities.com/SunsetStrip/Palms/5765/anstrnet.gif" alt="Internet" width="88" height="31" onerror="this.style.display='none'">
        </div>
        
        <p class="best-viewed">
            Best viewed with Netscape Navigator 4.0 at 800x600<br>
            <span class="spinning">🌐</span> Last updated: January 2026 <span class="spinning">🌐</span>
        </p>
        
        <p class="stars">★ ☆ ★ ☆ ★ ☆ ★ ☆ ★</p>
    </div>
</body>
</html>
